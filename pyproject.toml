[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexiforge"
version = "0.8.0"
description = "An open platform for building, curating, validating, and publishing high-quality multilingual passphrase wordlists."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.10,<3",
    "pyyaml>=6.0,<7",
    "textual>=8.2,<9",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.8,<7",
]

[project.scripts]
lexiforge = "lexiforge.cli:main"

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3", "ruff>=0.9", "types-pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lexiforge"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "data"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["PySide6", "PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "lexiforge.desktop.app",
    "lexiforge.desktop.main_window",
    "lexiforge.desktop.model",
    "lexiforge.desktop.workers",
]
disable_error_code = ["misc", "no-any-return", "untyped-decorator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "release: build and install a real wheel in an isolated environment",
]
