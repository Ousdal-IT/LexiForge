[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexiforge"
version = "0.1.0"
description = "An open platform for building, curating, validating, and publishing high-quality multilingual passphrase wordlists."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["pydantic>=2.10,<3", "pyyaml>=6.0,<7", "typer>=0.15,<1"]

[project.scripts]
lexiforge = "lexiforge.cli:app"

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3", "ruff>=0.9", "types-pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lexiforge"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
